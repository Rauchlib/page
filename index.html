<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lukas Brauchli</title>
<meta name="description" content="Lukas Brauchli. Hast du eine Frage? Stell sie mir: hallo@lukasbrauchli.ch">
<style>
  html {
    background: #f3f0e8;
    color: #1a1a1a;
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 9vh 8vw 6vh;
    box-sizing: border-box;
    font: 19px/1.45 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  }
  h1 {
    margin: 0;
    font-weight: normal;
    font-size: clamp(44px, 9vw, 120px);
    line-height: 1;
    letter-spacing: -0.02em;
  }
  p {
    margin: 1.4em 0 0;
    font-size: clamp(20px, 2.6vw, 30px);
    max-width: 26em;
  }
  a {
    color: inherit;
    text-decoration-thickness: 1px;
    text-underline-offset: 0.18em;
  }
  a:hover {
    background: #1a1a1a;
    color: #f3f0e8;
    text-decoration: none;
  }
  footer {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    font-size: 15px;
    color: #6b675e;
  }
  #graph {
    width: 120px;
    height: 120px;
    margin: 0 -6px -6px 0;
  }
  #graph line {
    stroke: #1a1a1a;
    stroke-width: 1;
  }
  #graph circle {
    fill: #1a1a1a;
  }
</style>
</head>
<body>
  <main>
    <h1>Lukas Brauchli</h1>
    <p>Hast du eine Frage? Stell sie mir an <a href="mailto:hallo@lukasbrauchli.ch">hallo@lukasbrauchli.ch</a>.</p>
  </main>
  <footer>
    <span>lukasbrauchli.ch</span>
    <svg id="graph" viewBox="0 0 100 100" aria-hidden="true"></svg>
  </footer>

<script>
  // Ein kleines Netz: Punkte treiben langsam, die Linien gehen mit.
  var nodes = [
    [50, 12], [22, 30], [78, 28], [52, 42], [30, 58],
    [82, 56], [12, 74], [58, 70], [36, 88], [80, 86]
  ];
  var edges = [[0, 1], [0, 2], [0, 3], [1, 3], [2, 3], [1, 4], [3, 4], [3, 5], [2, 5], [4, 6],
    [4, 7], [3, 7], [5, 7], [6, 8], [4, 8], [7, 8], [7, 9], [5, 9], [8, 9]];
  var svg = document.getElementById('graph');
  var ns = 'http://www.w3.org/2000/svg';
  var lines = edges.map(function () { return svg.appendChild(document.createElementNS(ns, 'line')); });
  var dots = nodes.map(function (n, i) {
    var c = document.createElementNS(ns, 'circle');
    c.setAttribute('r', i === 0 ? 4 : 3);
    return c;
  });
  dots.forEach(function (c) { svg.appendChild(c); });

  function draw(t) {
    var pos = nodes.map(function (n, i) {
      return [
        n[0] + Math.sin(t / 2300 + i * 1.7) * 5,
        n[1] + Math.cos(t / 2900 + i * 2.3) * 5
      ];
    });
    edges.forEach(function (e, k) {
      lines[k].setAttribute('x1', pos[e[0]][0]);
      lines[k].setAttribute('y1', pos[e[0]][1]);
      lines[k].setAttribute('x2', pos[e[1]][0]);
      lines[k].setAttribute('y2', pos[e[1]][1]);
    });
    pos.forEach(function (p, i) {
      dots[i].setAttribute('cx', p[0]);
      dots[i].setAttribute('cy', p[1]);
    });
  }

  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    draw(0);
  } else {
    (function loop(t) { draw(t); requestAnimationFrame(loop); })(0);
  }
</script>
</body>
</html>

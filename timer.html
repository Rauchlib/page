<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f2933">
  <title>Countdown-Timer</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #616e7c;
      --accent: #2563eb;
      --accent-text: #ffffff;
      --border: #d9e2ec;
      --done: #c62828;
      --radius: 16px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12171d;
        --card: #1c232b;
        --text: #f0f4f8;
        --muted: #9aa5b1;
        --accent: #4f8cff;
        --accent-text: #0b1220;
        --border: #323f4b;
        --done: #ff6b6b;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
      -webkit-tap-highlight-color: transparent;
    }
    main {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px 20px;
      text-align: center;
    }
    h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 20px; }
    .presets {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 24px;
    }
    .presets button[aria-pressed="true"] {
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
    }
    .display {
      font-size: clamp(3.5rem, 22vw, 6rem);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
      line-height: 1;
      margin: 8px 0 12px;
    }
    .status {
      min-height: 1.6em;
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--done);
      margin: 0 0 20px;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    button {
      font: inherit;
      font-size: 1rem;
      min-height: 52px;
      padding: 0 8px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      cursor: pointer;
      touch-action: manipulation;
    }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    button:disabled { opacity: 0.4; cursor: default; }
    #start { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
    main.finished .display { color: var(--done); }
    @media (prefers-reduced-motion: no-preference) {
      main.finished .display { animation: pulse 1s ease-in-out 3; }
      @keyframes pulse { 50% { opacity: 0.35; } }
    }
  </style>
</head>
<body>
  <main id="app">
    <h1>Countdown</h1>

    <div class="presets" role="group" aria-label="Dauer wählen">
      <button type="button" data-minutes="1" aria-pressed="true">1 Min.</button>
      <button type="button" data-minutes="5" aria-pressed="false">5 Min.</button>
      <button type="button" data-minutes="10" aria-pressed="false">10 Min.</button>
    </div>

    <div class="display" id="display" role="timer" aria-live="off">01:00</div>
    <p class="status" id="status" role="status" aria-live="assertive"></p>

    <div class="controls">
      <button type="button" id="start">Start</button>
      <button type="button" id="pause" disabled>Pause</button>
      <button type="button" id="reset">Zurücksetzen</button>
    </div>
  </main>

  <script>
    (function () {
      var app = document.getElementById('app');
      var display = document.getElementById('display');
      var statusEl = document.getElementById('status');
      var startBtn = document.getElementById('start');
      var pauseBtn = document.getElementById('pause');
      var resetBtn = document.getElementById('reset');
      var presetBtns = document.querySelectorAll('.presets button');

      var durationMs = 60 * 1000;   // gewählte Dauer
      var remainingMs = durationMs; // verbleibende Zeit
      var endTime = null;           // Zeitpunkt, an dem der Timer null erreicht
      var tickId = null;

      function format(ms) {
        var totalSec = Math.ceil(ms / 1000);
        var m = Math.floor(totalSec / 60);
        var s = totalSec % 60;
        return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
      }

      function render() {
        var text = format(remainingMs);
        display.textContent = text;
        document.title = (endTime ? text + ' – ' : '') + 'Countdown-Timer';
      }

      function setRunningUI(running) {
        startBtn.disabled = running || remainingMs <= 0;
        pauseBtn.disabled = !running;
        presetBtns.forEach(function (b) { b.disabled = running; });
      }

      function stopTicking() {
        if (tickId !== null) { clearInterval(tickId); tickId = null; }
      }

      function tick() {
        remainingMs = Math.max(0, endTime - Date.now());
        render();
        if (remainingMs <= 0) finish();
      }

      function finish() {
        stopTicking();
        endTime = null;
        remainingMs = 0;
        render();
        statusEl.textContent = 'Zeit abgelaufen';
        document.title = 'Zeit abgelaufen – Countdown-Timer';
        app.classList.add('finished');
        setRunningUI(false);
        if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
        beep();
      }

      function beep() {
        try {
          var Ctx = window.AudioContext || window.webkitAudioContext;
          if (!Ctx) return;
          var ctx = new Ctx();
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.frequency.value = 880;
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
          osc.connect(gain).connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.8);
          osc.onended = function () { ctx.close(); };
        } catch (e) { /* Ton ist optional */ }
      }

      function start() {
        if (endTime || remainingMs <= 0) return;
        statusEl.textContent = '';
        app.classList.remove('finished');
        endTime = Date.now() + remainingMs;
        tickId = setInterval(tick, 250);
        setRunningUI(true);
        render();
      }

      function pause() {
        if (!endTime) return;
        remainingMs = Math.max(0, endTime - Date.now());
        endTime = null;
        stopTicking();
        setRunningUI(false);
        render();
      }

      function reset() {
        stopTicking();
        endTime = null;
        remainingMs = durationMs;
        statusEl.textContent = '';
        app.classList.remove('finished');
        setRunningUI(false);
        render();
      }

      presetBtns.forEach(function (btn) {
        btn.addEventListener('click', function () {
          durationMs = Number(btn.dataset.minutes) * 60 * 1000;
          presetBtns.forEach(function (b) {
            b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
          });
          reset();
        });
      });

      startBtn.addEventListener('click', start);
      pauseBtn.addEventListener('click', pause);
      resetBtn.addEventListener('click', reset);

      // Nach Rückkehr in den Tab sofort aktualisieren (Browser drosseln Timer im Hintergrund)
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden && endTime) tick();
      });

      render();
    })();
  </script>
</body>
</html>
